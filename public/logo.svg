<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- Stacked bars with upward arrow mark -->
  <rect x="8"  y="42" width="36" height="7" rx="3.5" fill="#2563eb"/>
  <rect x="13" y="31" width="26" height="7" rx="3.5" fill="#3b82f6"/>
  <rect x="18" y="20" width="16" height="7" rx="3.5" fill="#60a5fa"/>
  <!-- Arrow up -->
  <polygon points="26,6 34,18 18,18" fill="#1d4ed8"/>
  <!-- Wordmark -->
  <text x="54" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Stack From</text>
  <text x="54" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#64748b">Scratch</text>
</svg>
